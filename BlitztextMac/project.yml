name: BlitztextMac
options:
  bundleIdPrefix: app.blitztext
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "15"
  configs:
    # Debug builds the active arch only. Forcing universal here made a plain
    # `xcodebuild test` fail: the WhisperKit SPM dependency builds arm64-only
    # in Debug, so linking the app for x86_64 found no matching slice.
    # build.sh overrides both settings on the command line for its universal
    # release artifact, so shipping builds are unaffected.
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 0.18.0

targets:
  BlitztextMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Features
      - path: Services
      - path: Views
      - path: Resources
        buildPhase: resources
        excludes:
          - AppIcon.icns
          - Info.plist
          - BlitztextMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blitztext.mac
        PRODUCT_NAME: Blitztext
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CODE_SIGN_ENTITLEMENTS: Resources/BlitztextMac.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    entitlements:
      path: Resources/BlitztextMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    scheme:
      testTargets:
        - BlitztextMacTests

  # Pure-logic unit tests: compiles the tested service files directly instead
  # of hosting the app (the menubar app's launch sequence — event taps,
  # single-instance guard — does not belong in a test run).
  BlitztextMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Services/KeyboardShortcut.swift
      - path: Services/TranscriptionQualityService.swift
      - path: Services/PasteContextService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blitztext.mac.tests
        GENERATE_INFOPLIST_FILE: YES
